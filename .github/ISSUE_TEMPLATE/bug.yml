name: Bug report
description: Report reproducible behavior in one plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Controller QOL Updates
        - Item Roll Ranges
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.3.1+rev.7
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: D2R, D2RCore, and D2RLoader versions/hashes; launcher; controller; relevant mods.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant log excerpt
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed account data, credentials, saves, dumps, and proprietary game binaries.
          required: true
