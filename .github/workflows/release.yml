name: release

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build-package-release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inventory Deposit artwork converter dependency
        run: python -m pip install -r plugins/inventory-deposit/requirements-build.txt

      - name: Configure Controller QOL Updates
        run: cmake -S plugins/controller-qol -B build/controller-qol -A x64

      - name: Build Controller QOL Updates
        run: cmake --build build/controller-qol --config Release --parallel

      - name: Test Controller QOL Updates
        run: ctest --test-dir build/controller-qol -C Release --output-on-failure

      - name: Configure Item Roll Ranges
        run: cmake -S plugins/item-roll-ranges -B build/item-roll-ranges -A x64

      - name: Build Item Roll Ranges
        run: cmake --build build/item-roll-ranges --config Release --parallel

      - name: Test Item Roll Ranges
        run: ctest --test-dir build/item-roll-ranges -C Release --output-on-failure

      - name: Configure Map Assistance
        run: cmake -S plugins/map-assistance -B build/map-assistance -A x64

      - name: Build Map Assistance
        run: cmake --build build/map-assistance --config Release --parallel

      - name: Test Map Assistance
        run: ctest --test-dir build/map-assistance -C Release --output-on-failure

      - name: Configure Inventory Deposit
        run: cmake -S plugins/inventory-deposit -B build/inventory-deposit -A x64

      - name: Build Inventory Deposit
        run: cmake --build build/inventory-deposit --config Release --parallel

      - name: Test Inventory Deposit
        run: ctest --test-dir build/inventory-deposit -C Release --output-on-failure

      - name: Configure Floating Damage
        run: cmake -S plugins/floating-damage -B build/floating-damage -A x64

      - name: Build Floating Damage
        run: cmake --build build/floating-damage --config Release --parallel

      - name: Test Floating Damage
        run: ctest --test-dir build/floating-damage -C Release --output-on-failure

      - name: Configure Always Show Sockets
        run: cmake -S plugins/always-show-sockets -B build/always-show-sockets -A x64

      - name: Build Always Show Sockets
        run: cmake --build build/always-show-sockets --config Release --parallel

      - name: Test Always Show Sockets
        run: ctest --test-dir build/always-show-sockets -C Release --output-on-failure

      - name: Test update-safe archive layout
        run: python -m unittest discover -s tools -p "test_package*.py" -v

      - name: Package runtime ZIPs
        run: >-
          python tools/package_runtime.py
          --controller-dll "build/controller-qol/Release/Controller QOL Updates.dll"
          --ranges-dll "build/item-roll-ranges/Release/Item Roll Ranges.dll"
          --map-assistance-dll "build/map-assistance/Release/Map Assistance.dll"
          --inventory-deposit-dll "build/inventory-deposit/Release/Inventory Deposit.dll"
          --inventory-deposit-artifact-verifier "build/inventory-deposit/Release/inventory-deposit-artifact-tests.exe"
          --floating-damage-dll "build/floating-damage/Release/Floating Damage.dll"
          --floating-damage-artifact-verifier "build/floating-damage/Release/floating-damage-artifact-tests.exe"
          --always-show-sockets-dll "build/always-show-sockets/Release/Always Show Sockets.dll"
          --always-show-sockets-artifact-verifier "build/always-show-sockets/Release/socket-artifact-tests.exe"
          --output dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D2R-Mods-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          body_path: docs/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
