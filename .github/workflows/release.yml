name: release

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build-package-release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inventory Deposit artwork converter dependency
        run: python -m pip install -r plugins/inventory-deposit/requirements-build.txt

      - name: Fetch reviewed Buff HUD companion package
        run: python tools/release_companion.py --output companions

      - name: Configure Controller QOL Updates
        run: cmake -S plugins/controller-qol -B build/controller-qol -A x64

      - name: Build Controller QOL Updates
        run: cmake --build build/controller-qol --config Release --parallel

      - name: Test Controller QOL Updates
        run: ctest --test-dir build/controller-qol -C Release --output-on-failure

      - name: Configure Item Roll Ranges
        run: cmake -S plugins/item-roll-ranges -B build/item-roll-ranges -A x64

      - name: Build Item Roll Ranges
        run: cmake --build build/item-roll-ranges --config Release --parallel

      - name: Test Item Roll Ranges
        run: ctest --test-dir build/item-roll-ranges -C Release --output-on-failure

      - name: Configure Map Assistance
        run: cmake -S plugins/map-assistance -B build/map-assistance -A x64

      - name: Build Map Assistance
        run: cmake --build build/map-assistance --config Release --parallel

      - name: Test Map Assistance
        run: ctest --test-dir build/map-assistance -C Release --output-on-failure

      - name: Configure Inventory Deposit
        run: cmake -S plugins/inventory-deposit -B build/inventory-deposit -A x64

      - name: Build Inventory Deposit
        run: cmake --build build/inventory-deposit --config Release --parallel

      - name: Test Inventory Deposit
        run: ctest --test-dir build/inventory-deposit -C Release --output-on-failure

      - name: Configure Floating Damage
        run: cmake -S plugins/floating-damage -B build/floating-damage -A x64

      - name: Build Floating Damage
        run: cmake --build build/floating-damage --config Release --parallel

      - name: Test Floating Damage
        run: ctest --test-dir build/floating-damage -C Release --output-on-failure

      - name: Configure Always Show Sockets
        run: cmake -S plugins/always-show-sockets -B build/always-show-sockets -A x64

      - name: Build Always Show Sockets
        run: cmake --build build/always-show-sockets --config Release --parallel

      - name: Test Always Show Sockets
        run: ctest --test-dir build/always-show-sockets -C Release --output-on-failure

      - name: Configure Gem Bag UI
        run: cmake -S plugins/gem-bag-ui -B build/gem-bag-ui -A x64

      - name: Build Gem Bag UI
        run: cmake --build build/gem-bag-ui --config Release --parallel

      - name: Test Gem Bag UI
        run: ctest --test-dir build/gem-bag-ui -C Release --output-on-failure

      - name: Configure Day Night Cycle
        run: cmake -S plugins/day-night-cycle -B build/day-night-cycle -A x64

      - name: Build Day Night Cycle
        run: cmake --build build/day-night-cycle --config Release --parallel

      - name: Test Day Night Cycle
        run: ctest --test-dir build/day-night-cycle -C Release --output-on-failure

      - name: Configure Ultrawide
        run: cmake -S plugins/ultrawide -B build/ultrawide -A x64

      - name: Build Ultrawide
        run: cmake --build build/ultrawide --config Release --parallel

      - name: Test Ultrawide
        run: ctest --test-dir build/ultrawide -C Release --output-on-failure

      - name: Configure Pyre Loot Filter
        run: cmake -S plugins/pyre-lootfilter -B build/pyre-lootfilter -A x64

      - name: Build Pyre Loot Filter
        run: cmake --build build/pyre-lootfilter --config Release --parallel

      - name: Test Pyre Loot Filter
        run: ctest --test-dir build/pyre-lootfilter -C Release --output-on-failure

      - name: Configure Pyre Stash Search
        run: cmake -S plugins/pyre-stashsearch -B build/pyre-stashsearch -A x64

      - name: Build Pyre Stash Search
        run: cmake --build build/pyre-stashsearch --config Release --parallel

      - name: Test Pyre Stash Search
        run: ctest --test-dir build/pyre-stashsearch -C Release --output-on-failure

      - name: Configure Running Defense
        run: cmake -S plugins/running-defense -B build/running-defense -A x64

      - name: Build Running Defense
        run: cmake --build build/running-defense --config Release --parallel

      - name: Test Running Defense
        run: ctest --test-dir build/running-defense -C Release --output-on-failure

      - name: Test update-safe archive layout
        run: python -m unittest discover -s tools -p "test_package*.py" -v

      - name: Package runtime ZIPs
        run: >-
          python tools/package_runtime.py
          --controller-dll "build/controller-qol/Release/Controller QOL Updates.dll"
          --ranges-dll "build/item-roll-ranges/Release/Item Roll Ranges.dll"
          --map-assistance-dll "build/map-assistance/Release/Map Assistance.dll"
          --inventory-deposit-dll "build/inventory-deposit/Release/Inventory Deposit.dll"
          --inventory-deposit-artifact-verifier "build/inventory-deposit/Release/inventory-deposit-artifact-tests.exe"
          --floating-damage-dll "build/floating-damage/Release/Floating Damage.dll"
          --floating-damage-artifact-verifier "build/floating-damage/Release/floating-damage-artifact-tests.exe"
          --always-show-sockets-dll "build/always-show-sockets/Release/Always Show Sockets.dll"
          --always-show-sockets-artifact-verifier "build/always-show-sockets/Release/socket-artifact-tests.exe"
          --gem-bag-dll "build/gem-bag-ui/Release/Gem Bag UI.dll"
          --gem-bag-artifact-verifier "build/gem-bag-ui/Release/gem-bag-artifact-tests.exe"
          --day-night-dll "build/day-night-cycle/Release/Day Night Cycle.dll"
          --day-night-artifact-verifier "build/day-night-cycle/Release/day-night-artifact-tests.exe"
          --ultrawide-dll "build/ultrawide/Release/Ultrawide.dll"
          --ultrawide-artifact-verifier "build/ultrawide/Release/ultrawide-artifact-tests.exe"
          --pyre-lootfilter-dll "build/pyre-lootfilter/Release/pyre-lootfilter.dll"
          --pyre-lootfilter-artifact-verifier "build/pyre-lootfilter/Release/pyre-lootfilter-artifact-tests.exe"
          --pyre-stashsearch-dll "build/pyre-stashsearch/Release/pyre-stashsearch.dll"
          --pyre-stashsearch-artifact-verifier "build/pyre-stashsearch/Release/pyre-stashsearch-artifact-tests.exe"
          --running-defense-dll "build/running-defense/Release/Running Defense.dll"
          --running-defense-artifact-verifier "build/running-defense/Release/running-defense-artifact-tests.exe"
          --buffhud-runtime-zip "companions/Buff-HUD-1.3.1+rev.3.zip"
          --output dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: D2R-Mods-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          body_path: docs/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
