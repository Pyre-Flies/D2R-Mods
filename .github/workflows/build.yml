name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.plugin }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        plugin: [controller-qol, item-roll-ranges, map-assistance, inventory-deposit, floating-damage, always-show-sockets, gem-bag-ui, day-night-cycle]
        include:
          - plugin: controller-qol
            dll: Controller QOL Updates.dll
          - plugin: item-roll-ranges
            dll: Item Roll Ranges.dll
          - plugin: map-assistance
            dll: Map Assistance.dll
          - plugin: inventory-deposit
            dll: Inventory Deposit.dll
          - plugin: floating-damage
            dll: Floating Damage.dll
          - plugin: always-show-sockets
            dll: Always Show Sockets.dll
          - plugin: gem-bag-ui
            dll: Gem Bag UI.dll
          - plugin: day-night-cycle
            dll: Day Night Cycle.dll

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install artwork converter dependency
        if: matrix.plugin == 'inventory-deposit'
        run: python -m pip install -r plugins/inventory-deposit/requirements-build.txt

      - name: Fetch reviewed UnHoarder for compatibility tests
        if: matrix.plugin == 'controller-qol'
        run: python tools/release_companion.py --output companions

      - name: Configure
        run: cmake -S "plugins/${{ matrix.plugin }}" -B "build/${{ matrix.plugin }}" -A x64

      - name: Configure exact UnHoarder fixture
        if: matrix.plugin == 'controller-qol'
        run: cmake -S plugins/controller-qol -B build/controller-qol -DQOL_UNHOARDER_SOCKET_BATCH_ALT_DLL="${{ github.workspace }}/companions/unhoarder.dll"

      - name: Build
        run: cmake --build "build/${{ matrix.plugin }}" --config Release --parallel

      - name: Test
        run: ctest --test-dir "build/${{ matrix.plugin }}" -C Release --output-on-failure

      - name: Test Inventory Deposit packaging
        if: matrix.plugin == 'inventory-deposit'
        run: python -m unittest discover -s tools -p test_package_inventory_deposit.py -v

      - name: Test eight-plugin packaging and update-safe archive layout
        if: matrix.plugin == 'floating-damage'
        run: python tools/test_package_runtime.py

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ github.sha }}
          path: build/${{ matrix.plugin }}/Release/${{ matrix.dll }}
          if-no-files-found: error
