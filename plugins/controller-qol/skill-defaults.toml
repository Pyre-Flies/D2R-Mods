# Extra skill IDs, including discovered OSkills, appear here in each mod profile.
# true enables the configured targeting mode; false keeps native aim and allows R3.
# "disabled" locks aim off and hides the R3 toggle for that skill.
# The complete profile supports up to 1024 IDs, including the class catalog.
[aim.custom]
# Recognized Reimagined Warp (429) is added automatically with ground targeting.
# Use R3 to enable it; no manual entry is needed when discovery recognizes it.
# Manual fallback for packs without readable skill data: add the enable entry
# below and the matching targeting entry in this SAME skill profile.
# "429" = false # Warp: initially off; R3 can enable it

# Targeting mode does not enable a skill. Enable it in its class/custom section.
# "ground" aims at the cursor; "snap" aims at an eligible enemy near the cursor.
[aim.targeting]
"136" = "snap" # Reimagined Winter's Gambit; enable separately
"141" = "snap" # Reimagined Chasm Break; enable separately
# "429" = "ground" # Manual Warp fallback only; discovery already supplies this

# Reviewed Reimagined projectile estimates; discovery does not calculate travel times.
# Milliseconds per world tile (0..200). Zero retains current-position aim.
# Leading requires an enabled skill using snap targeting; these values do not enable it.
# New estimates need gameplay testing; see docs/PROJECTILE-LEADING.md.
